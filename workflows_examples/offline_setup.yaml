output_folder: output/  # Directory for generated files; created if necessary
files_prefix : "cnaps_sorted"
call_threshold : 0.001 #uncertainty threshold for adding a configuration
add_threshold : 0.0001 #uncertainty configuration for adding environments

species_code : 
    "29" : 0            #chemical species and their 'code'
isolated_energies : 
  "29" :  -1661.4439420703893   #isolated atom energy
isolated_energies_mapped:
  "0" :  -1661.4439420703893    #same as above

seed : 123  # Seed for rearranging singular datasets and choosing train configs
when_rollback: "accept" # Restore rejected hyperparameters while retaining added environments.
nr_initial_envs : 5 # The number of environments chosen randomly from the first configuration to bootstrap the offline learning

optimize_every : 1 # Every how many oracle calls optimization of hyps is performed - e.g. every 2,3 etc...
min_optimize: 1
max_optimize: 5

# Set up FLARE calculator with (sparse) Gaussian process
flare_calc:
    gp: SGP_Wrapper
    kernels:
        - name: NormalizedDotProduct   #kernel 
          sigma: 3.5
          power: 2
    descriptors:
        - name: B2   #ace descriptors - B2 term (three body)
          nmax: 8    #number of radial bases
          lmax: 4    #max l for spherical harmonics
          cutoff_function: quadratic
          radial_basis: chebyshev
    energy_noise: 0.1     #expected error hyps
    forces_noise: 0.05    #
    stress_noise: 0.005   #
    species:
        - 29                    #chemical number
    single_atom_energies:
        - -1661.4439420703893   #isolated energy
    cutoff: 4.9                 #descriptor's cutoff
    variance_type: local        #uncertainty measure type
#    max_iterations: 20 
    use_mapping: True           #map to faster equivalent potential
    energy_training: True       #whether to train on energies, forces, stresses
    force_training: True
    stress_training: True

optimizer_options:
  loss_function_config:
    name : "negative_likelihood" # Which loss function to use, "negative_likelihood" or "huber"
    weights :  # if "huber", you need to specify weight for energy forces and stresses
      - 1.
      - 0.1
      - 0
  opt_method: "L-BFGS-B"
  gtol : 1.0e-3
  max_iterations : 100
  minhyps : #If hyps go below this, rollback
    - 0.
    - 0. 
    - 0.
    - 0.
  maxhyps : #If hyps go above this, rollback
    - 4. 
    - 0.4
    - 0.15
    - 0.01


dataset_style: 'random'       #random, ordered, intact, injected, cnap, gcn
test_set_split: 0.2 #how many of the entire set of structures going into the test set. - igonred if intact


bulk_files:
  - 'bulk_5_configs.xyz'

surf_files: []

clusters_files: []

#######################################
###only relevant for cnap, gcn style###
#######################################

solvation_shell_cutoff:  #generally 0.85*alat

#####################################



######################################
###only relevant for injected style###
######################################

injection_frequency: 4
stop_inject:         60

injection_files:
  - #e.g. relaxed structures


######################################



####################################
###only relevant for intact style###
####################################

train_file: 
test_file: 

#####################################
